name: Proactive Advisory Creator

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  detect-advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create branches and commits
      pull-requests: write # Needed to create pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history and tags for version comparison

      - name: Set up environment
        run: |
          sudo apt-get update

      - name: Configure Git
        run: |
          git config --global user.name "Bottlerocket Bot"
          git config --global user.email "bottlerocket-bot@amazon.com"

      - name: Run advisory creator
        run: |
          .github/scripts/proactive-advisory-creator/advisory-creator.sh --debug --current-tag "${GITHUB_REF#refs/tags/}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
